<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MiSTer Control</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Action">
      <sdpi-select setting="kind" default="menu">
        <option value="reboot">Reboot</option>
        <option value="menu">Go to Menu</option>
        <option value="screenshot">Screenshot</option>
        <option value="volume_up">Volume +</option>
        <option value="volume_down">Volume −</option>
        <option value="launch">Launch game…</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Launch path">
      <sdpi-textfield setting="launchPath" placeholder="/media/fat/games/SNES/Chrono.sfc"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="MiSTer IP / host">
      <sdpi-textfield setting="host" global placeholder="192.168.1.50"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="REST port">
      <sdpi-textfield setting="port" global placeholder="8182"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
